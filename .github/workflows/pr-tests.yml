name: PR Tests

on:
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Unit tests don't touch Firebase; the committed placeholder is enough and needs no secrets,
      # so PRs from forks work too. The debug build needs a client for its .debug package name.
      - name: Create placeholder google-services.json
        run: |
          jq '.client += [.client[0] | .client_info.android_client_info.package_name += ".debug"]' \
            composeApp/google-services.json.example > composeApp/google-services.json

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: composeApp/build/reports/tests/testDebugUnitTest
          retention-days: 7
